<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
    <h1 class="text-3xl font-bold text-center text-blue-600">Register</h1>
    <form method="POST" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="block text-gray-700">Username</label>
        <input type="text" name="username" class="w-full p-2 border rounded-md mb-4" required>

        <label class="block text-gray-700">Email</label>
        <input type="email" name="email" class="w-full p-2 border rounded-md mb-4" required>

        <label class="block text-gray-700">Password</label>
        <input type="password" name="password" class="w-full p-2 border rounded-md mb-4" required>

        <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600">
            Register
        </button>
    </form>
</div>

</body>
</html>
