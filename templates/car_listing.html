<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Your Car</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="fixed top-0 w-full bg-white shadow-md z-50 p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">Carsfy</h1>
        <ul class="hidden md:flex space-x-6">
            <li><a class="text-gray-800 hover:text-blue-500" href="{{ url_for('home') }}">Home</a></li>
            <li><a class="text-gray-800 hover:text-blue-500" href="{{ url_for('cars_for_sale') }}">Cars for Sale</a></li>
            <li><a class="text-gray-800 hover:text-blue-500" href="{{ url_for('car_listing') }}">List Your Car</a></li>
            <li><a class="text-gray-800 hover:text-blue-500" href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </div>
</nav>

<!-- List Car Section -->
<div class="flex justify-center items-center min-h-screen pt-20">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-lg w-full">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-4">List Your Car</h1>
        <form method="POST" action="{{ url_for('car_listing') }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="block text-gray-700 font-semibold mb-1">Car Title</label>
            <input type="text" name="title" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-400" required>

            <label class="block text-gray-700 font-semibold mb-1">Description</label>
            <textarea name="description" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-400" required></textarea>

            <label class="block text-gray-700 font-semibold mb-1">Starting Price (€)</label>
            <input type="number" name="starting_price" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-400" required>

            <label class="block text-gray-700 font-semibold mb-1">Auction Duration</label>
            <select name="auction_duration" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-400" required>
                <option value="24h">24 Hours</option>
                <option value="48h">48 Hours</option>
                <option value="1w">1 Week</option>
                <option value="1m">1 Month</option>
            </select>

            <label class="block text-gray-700 font-semibold mb-1">Upload Images</label>
            <input type="file" name="images" multiple class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-400" required>

            <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition duration-200">
                Submit Car
            </button>
        </form>
    </div>
</div>

</body>
</html>
